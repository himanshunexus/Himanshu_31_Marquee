<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Namma | Branding, Designing & Webflow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mouse Pointer -->
  <div class="pointer"></div>

  <!-- Video Cursor Card (Reveals over Hero section) -->
  <div class="cursor-box">
    <video autoplay muted loop playsinline>
      <source src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68dfa5030619737bde7460e5_Home-Hero-DK%20ModeV4-transcode.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Fullscreen Slide-Down Navigation Menu -->
  <div class="fixed-menu"></div>

  <!-- Main Navigation Bar -->
  <nav class="navbar">
    <div class="right">
      <div class="logo">
        <span>STUDIO</span>
        <span>NAMMA</span>
      </div>
      <div class="mode">
        <span>DARK</span>
        <span>MODE</span>
      </div>
    </div>
    <div class="left">
      <div class="menu">
        <span class="menuBtn">MENU</span>
      </div>
      <div class="connect">
        <span>LET'S TALK</span>
      </div>
    </div>
  </nav>

  <!-- Hero Headline Section -->
  <section class="hero" id="hero">
    <p>WE THINK</p>
    <p>CRAFT AND</p>
    <p>DESIGN</p>
  </section>

  <!-- Embedded Video Showcase Section -->
  <section class="videoshell" id="work">
    <video autoplay muted loop playsinline>
      <source src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68dfa5030619737bde7460e5_Home-Hero-DK%20ModeV4-transcode.mp4" type="video/mp4">
    </video>
  </section>

  <!-- Interactive Hover Text Section -->
  <section class="hero-text" id="about">
    <div>IT'S NEVER "JUST A WEBSITE."</div>

    <div>
      EVERY
      <span class="hover-trigger">
        DETAIL
        <div class="image-stack">
          <img src="../../assets/images/vintageCar1.avif" alt="Vintage car preview 1" class="stack-card">
          <img src="../../assets/images/vintageCar2.avif" alt="Vintage car preview 2" class="stack-card">
          <img src="../../assets/images/vintageCar3.avif" alt="Vintage car preview 3" class="stack-card">
          <img src="../../assets/images/vintageCar4.avif" alt="Vintage car preview 4" class="stack-card">
        </div>
      </span>
      MATTERS.
    </div>

    <div>WE CRAFT DIGITAL EXPERIENCES.</div>
    <div>YOUR DESIGN. OUR OBSESSION.</div>

    <div>
      YOUR BRAND, OUR
      <span class="hover-trigger">
        PLAYGROUND
        <div class="image-stack">
          <img src="../../assets/images/vintageCar5.avif" alt="Vintage car preview 5" class="stack-card">
          <img src="../../assets/images/vintageCar6.avif" alt="Vintage car preview 6" class="stack-card">
          <img src="../../assets/images/vintageCar7.avif" alt="Vintage car preview 7" class="stack-card">
          <img src="../../assets/images/vintageCar8.avif" alt="Vintage car preview 8" class="stack-card">
        </div>
      </span>
    </div>
  </section>

  <!-- Portfolio / Content Grid Placeholder -->
  <section class="box-cont" id="contact">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
