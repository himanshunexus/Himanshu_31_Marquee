<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div id = "ct">
        <h1>1ST</h1>
        <h1>2ND</h1>
        <h1>3RD</h1>
        <button onclick="deleteH1()"> DELETE </button>
    </div>

        function deleteH1() {
            const element = document.querySelector("#ct h1");

            parentElement.removeChild(element);
        }
    </script>
