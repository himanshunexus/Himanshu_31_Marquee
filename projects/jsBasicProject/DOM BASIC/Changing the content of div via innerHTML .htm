<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPDATING OF DATA</title>
</head>
<body>
    <div id = "ndiv">
        Hello there
    </div>
    <script>
        // USING OF QUERY SELECTOR ALL
        const para = document.querySelectorAll("div");
        para.forEach (div =>{
            div.innerHTML = 'Name: <h1>Mahi</h1>, Age: <i>20</i>, Sem: <u>5</u>';
        })
        console.log(para);
        // SINGLE ELEMENT SELECTOR
        const oned = document.querySelector("div");
        oned.innerHTML = 'Name: <b>Mahi</b>, Age: <i>20</i>, Sem: <u>5</u>';

    </script>
</body>
</html>
