<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPDATING</title>
</head>
<body>
    <div id = "update">
        <h1>I WILL GO GYM</h1>
        <h1>AND I WILL EAT HEALTHY</h1>
        <h1>AND I WILL SLEEP EARLY</h1>
        <button onclick="update()">Click to update</button>
    </div>
    <script>
        function update() {
            document.querySelector("#update h1").textContent = "I WILL SLEEP";
        }
    </script>
</body>
</html>
