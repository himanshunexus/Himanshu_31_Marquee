<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO APP</title>
</head>
<body>
    <div id = "ct">
        <h1>TO DO APP</h1>
        <h1>DAILY DSA PROBLEM</h1>
        <input type = "text" placeholder = "Enter your task here" id = "taskInput">
        <button onclick = "addtodo()">ADD TO DO </button>
    </div>
    <script>
        function addtodo() {
            const element = document.querySelector("#ct");
            const taskInput = document.querySelector("#taskInput");
            const newTodo = document.createElement("p");
            newTodo.textContent = taskInput.value;
            element.appendChild(newTodo).style.fontSize = "20px";
        }
    </script>
</body>
</html>
