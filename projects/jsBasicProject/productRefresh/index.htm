<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="refresh-btn">Refresh Product </button>
    <div class="card" id="product-card">
        <img id="product-img" src="" alt="Product Image">
        <h2 id="product-name">Product Title</h2>
        <p class="price" id="product-price">$0.00</p>
        
        <div class="specs-container" id="product-specs"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
