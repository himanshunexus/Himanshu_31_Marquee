<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess No</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Guess the Number of Dice</h1>
        <p>Guess which number will appear on the dice!</p>

        <p id="result"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
